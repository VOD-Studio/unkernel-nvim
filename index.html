<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Neovim · unkernel</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link
      rel="preload"
      href="/fonts/SymbolsNerdFontMono-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <!-- Fullscreen 100vw x 100vh WebGL2 Terminal Stage -->
    <main id="terminal-stage" aria-label="Neovim Terminal Canvas"></main>

    <section class="guest-preview" id="guest-preview" aria-label="Guest 端口预览" hidden>
      <form class="guest-preview-toolbar">
        <label for="guest-preview-port">端口</label>
        <input class="text-input" id="guest-preview-port" type="number" min="1" max="65535" step="1" inputmode="numeric" required />
        <input class="text-input" id="guest-preview-path" aria-label="路径" type="text" value="/" spellcheck="false" />
        <button class="mini-btn active" id="btn-load-preview" type="submit">打开</button>
        <button class="mini-btn" id="btn-close-preview" type="button">关闭</button>
      </form>
      <div class="guest-preview-status" id="guest-preview-status" role="status">运行 guest Web 服务后，输入其端口。</div>
      <div class="guest-preview-frame-area" id="guest-preview-frame-area"></div>
    </section>

    <!-- Minimal Boot Overlay (fades out automatically once Neovim renders) -->
    <div id="boot-overlay" class="boot-overlay">
      <div class="boot-card">
        <div class="boot-header">
          <span class="boot-dot"></span>
          <span class="boot-brand">unkernel · Neovim 0.12</span>
          <span class="boot-badge" id="boot-mode-badge">aarch64 · JIT</span>
        </div>
        <div class="boot-title" id="boot-title">正在初始化运行环境…</div>
        <div class="boot-detail" id="boot-detail">Debian · DefectingCat/nvim</div>
        <div class="boot-bar-track">
          <div class="boot-bar-fill" id="boot-bar-fill"></div>
        </div>
        <div class="boot-actions" id="boot-actions" hidden>
          <button class="mini-btn active" id="btn-boot-snapshot" type="button" hidden>以内存快照模式启动</button>
          <button class="mini-btn active" id="btn-resume-session" type="button">恢复会话</button>
          <button class="mini-btn" id="btn-discard-session" type="button" hidden>放弃快照并启动</button>
        </div>
      </div>
    </div>

    <!-- Floating control center trigger & session tabs -->
    <div class="floating-hud" id="floating-hud">
      <div class="session-tabs" id="session-tabs" role="tablist" aria-label="终端会话"></div>
      <button
        id="menu-pill"
        class="menu-pill"
        type="button"
        title="打开控制中心 (Ctrl+Shift+P / ⌘+Shift+P)"
        aria-haspopup="dialog"
        aria-controls="modal-backdrop"
      >
        <span class="pill-dot" id="pill-dot"></span>
        <span class="pill-label" id="pill-label">nvim</span>
        <kbd class="pill-kbd" id="pill-kbd">⌘⇧P</kbd>
      </button>
    </div>

    <!-- Modal Control Center (hidden by default) -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-dialog" id="modal-dialog">
        <header class="modal-header">
          <div class="modal-title-group">
            <h2 class="modal-title" id="modal-title">Neovim 控制中心</h2>
            <span class="modal-subtitle"></span>
          </div>
          <button class="modal-close" id="btn-close-modal" type="button">关闭 <kbd>Esc</kbd></button>
        </header>
        <div class="modal-tabs" role="tablist" aria-label="控制中心">
          <button class="modal-tab" id="modal-tab-workspace" type="button" role="tab" data-tab="workspace" aria-controls="modal-panel-workspace" aria-selected="true">工作区与会话</button>
          <button class="modal-tab" id="modal-tab-storage" type="button" role="tab" data-tab="storage" aria-controls="modal-panel-storage" aria-selected="false" tabindex="-1">存储与备份</button>
          <button class="modal-tab" id="modal-tab-system" type="button" role="tab" data-tab="system" aria-controls="modal-panel-system" aria-selected="false" tabindex="-1">虚拟机与诊断</button>
        </div>
        <div class="modal-panel" id="modal-panel-workspace" role="tabpanel" aria-labelledby="modal-tab-workspace" tabindex="0"></div>
        <div class="modal-panel" id="modal-panel-storage" role="tabpanel" aria-labelledby="modal-tab-storage" tabindex="0" hidden></div>
        <div class="modal-panel" id="modal-panel-system" role="tabpanel" aria-labelledby="modal-tab-system" tabindex="0" hidden></div>
        <div class="modal-feedback" id="modal-feedback" role="status"></div>
        <div class="modal-restart" id="modal-restart" hidden>
          <div id="modal-restart-message" role="status"></div>
          <button class="mini-btn active" id="btn-apply-restart" type="button">同步并重启</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
