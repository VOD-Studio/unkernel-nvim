<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Neovim · unkernel</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link
      rel="preload"
      href="/fonts/SymbolsNerdFontMono-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <!-- Desktop Top Status Bar (visible only in Desktop Mode) -->
    <header id="desktop-topbar" class="desktop-topbar" hidden>
      <div class="desktop-topbar-left">
        <button id="btn-exit-desktop" class="topbar-brand-btn" type="button" title="返回全屏终端 (Ctrl+Shift+D / ⌘+Shift+D)">
          <span class="boot-dot"></span>
          <span>unkernel desktop</span>
        </button>
        <span class="desktop-topbar-sep" aria-hidden="true"></span>
        <span id="desktop-topbar-title" class="desktop-topbar-title">终端</span>
      </div>
      <div class="desktop-topbar-right">
        <span id="desktop-topbar-meta" class="desktop-topbar-meta">Debian · SHM · Wayland 待命</span>
        <button id="btn-desktop-launcher" class="topbar-btn" type="button" title="应用启动器 (Ctrl+Shift+K / ⌘+Shift+K)">应用</button>
        <button id="btn-desktop-mute" class="topbar-btn" type="button" hidden>音频</button>
        <button id="btn-desktop-control" class="topbar-btn" type="button" title="控制中心 (Ctrl+Shift+P / ⌘+Shift+P)">控制中心</button>
        <span id="desktop-topbar-clock" class="desktop-topbar-clock"></span>
      </div>
    </header>

    <!-- Unified Stage: Fullscreen Terminal by default; Desktop Wallpaper + Window Layer in Desktop Mode -->
    <div id="desktop-stage" class="desktop-stage">
      <div id="desktop-wallpaper" class="desktop-wallpaper" aria-hidden="true"></div>
      <div id="desktop-wallpaper-scrim" class="desktop-wallpaper-scrim" aria-hidden="true"></div>
      <div id="desktop-wland-layer" class="desktop-wland-layer">
        <div id="desktop-windows-layer" class="desktop-windows-layer">
          <!-- Terminal / Neovim Window (fullscreen in default mode; floating window in Desktop Mode) -->
          <section id="terminal-window" class="terminal-window" aria-label="Neovim 终端窗口">
            <header id="terminal-win-bar" class="terminal-win-bar">
              <span id="terminal-win-icon" class="win-title-icon" aria-hidden="true"></span>
              <span id="terminal-win-title" class="terminal-win-title">Neovim / Shell</span>
              <div id="terminal-win-tabs-slot" class="terminal-win-tabs-slot"></div>
              <div class="win-controls">
                <button id="btn-term-minimize" class="win-ctrl" type="button" title="最小化">―</button>
                <button id="btn-term-maximize" class="win-ctrl" type="button" title="最大化 / 还原">□</button>
                <button id="btn-term-fullscreen" class="win-ctrl" type="button" title="切换至全屏终端">⤢</button>
              </div>
            </header>
            <main id="terminal-stage" aria-label="Neovim Terminal Canvas"></main>
          </section>
        </div>
      </div>
    </div>

    <!-- Desktop Bottom Floating Dock (visible only in Desktop Mode) -->
    <nav id="desktop-dock" class="desktop-dock" aria-label="桌面任务栏" hidden>
      <div class="dock-section dock-section-pinned">
        <button
          id="dock-btn-terminal"
          class="dock-item running"
          type="button"
          aria-label="Neovim / 终端"
          data-dock-tooltip="Neovim / 终端"
        >
          <span class="dock-icon-wrap" id="dock-icon-terminal" aria-hidden="true"></span>
          <span class="dock-badge" id="dock-badge-terminal" hidden></span>
          <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button
          id="dock-btn-launcher"
          class="dock-item"
          type="button"
          aria-label="应用启动器"
          data-dock-tooltip="应用启动器"
        >
          <span class="dock-icon-wrap" id="dock-icon-launcher" aria-hidden="true"></span>
          <span class="dock-indicator" aria-hidden="true"></span>
        </button>
      </div>
      <span class="dock-sep" aria-hidden="true"></span>
      <div id="desktop-dock-apps" class="dock-section desktop-dock-apps"></div>
      <span class="dock-sep dock-sep-apps" aria-hidden="true"></span>
      <div class="dock-section dock-section-tools">
        <button
          id="dock-btn-preview"
          class="dock-item"
          type="button"
          aria-label="Guest 端口预览"
          data-dock-tooltip="Guest 端口预览"
        >
          <span class="dock-icon-wrap" id="dock-icon-preview" aria-hidden="true"></span>
          <span class="dock-badge" id="dock-badge-preview" hidden></span>
          <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button
          id="dock-btn-settings"
          class="dock-item"
          type="button"
          aria-label="控制中心"
          data-dock-tooltip="控制中心"
        >
          <span class="dock-icon-wrap" id="dock-icon-settings" aria-hidden="true"></span>
          <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button
          id="dock-btn-fullscreen"
          class="dock-item"
          type="button"
          aria-label="返回全屏终端"
          data-dock-tooltip="返回全屏终端"
        >
          <span class="dock-icon-wrap" id="dock-icon-fullscreen" aria-hidden="true"></span>
          <span class="dock-indicator" aria-hidden="true"></span>
        </button>
      </div>
    </nav>
    <div id="desktop-dock-tooltip" class="dock-tooltip" role="tooltip" hidden></div>
    <div id="desktop-context-menu" class="desktop-context-menu" role="menu" hidden></div>

    <!-- App Launcher Overlay -->
    <dialog id="desktop-launcher-backdrop" class="launcher-backdrop" aria-labelledby="launcher-title" aria-describedby="desktop-launcher-note">
      <div class="launcher-dialog">
        <header class="launcher-hero">
          <span id="desktop-launcher-mark" class="launcher-mark" aria-hidden="true"></span>
          <div>
            <h2 id="launcher-title">应用启动器</h2>
            <p id="desktop-launcher-note" class="launcher-status"></p>
          </div>
          <button id="btn-close-launcher" class="launcher-close" type="button" aria-label="关闭启动器" title="关闭（Esc）">
            <kbd>Esc</kbd>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" /></svg>
          </button>
        </header>
        <form id="desktop-launcher-form" class="launcher-command">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3.5 5.5 4.5 4.5-4.5 4.5M10.5 14.5H16" /></svg>
          <input
            id="desktop-launcher-input"
            type="text"
            aria-label="自定义启动命令"
            placeholder="输入启动命令，如 foot"
            required
            spellcheck="false"
            autocomplete="off"
          />
          <button id="btn-run-launcher-command" type="submit">
            运行
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3.5v5H3.5m3-3-3 3 3 3" /></svg>
          </button>
        </form>
        <p id="desktop-launcher-error" class="launcher-error" role="alert"></p>
        <section class="launcher-library" aria-label="应用库">
          <div class="launcher-toolbar">
            <fieldset id="desktop-launcher-filters" class="launcher-filters" aria-label="应用分类"></fieldset>
            <span id="desktop-launcher-count" class="launcher-count" aria-live="polite"></span>
          </div>
          <div class="launcher-scroll">
            <fieldset id="desktop-launcher-grid" class="launcher-grid" aria-label="应用列表"></fieldset>
          </div>
        </section>
        <footer class="launcher-options">
          <label class="launcher-lodpi" title="以 1× LoDPI 模式启动，适用于 X11 和非 HiDPI 应用">
            <input id="launcher-lodpi-toggle" type="checkbox" role="switch" />
            <span>1× 兼容缩放</span>
          </label>
          <div class="launcher-install">
            <span>需 Wisp 联网</span>
            <button id="btn-desktop-install-apps" type="button">
              <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2.5v8m-3-3 3 3 3-3M3 11v3.5h12V11" /></svg>
              安装推荐应用
            </button>
          </div>
        </footer>
      </div>
    </dialog>

    <!-- Desktop Wallpaper Picker Overlay -->
    <div id="desktop-wallpaper-backdrop" class="wallpaper-backdrop" role="dialog" aria-modal="true" aria-labelledby="wallpaper-title" hidden>
      <div class="wallpaper-dialog">
        <header class="wallpaper-header">
          <div>
            <h2 id="wallpaper-title" class="wallpaper-title">桌面壁纸</h2>
            <p id="desktop-wallpaper-note" class="wallpaper-note"></p>
          </div>
          <button id="btn-close-wallpaper" class="modal-close" type="button">关闭 <kbd>Esc</kbd></button>
        </header>
        <div class="wallpaper-section">
          <div class="wallpaper-section-title">内置精选</div>
          <div id="desktop-wallpaper-grid" class="wallpaper-grid"></div>
        </div>
        <div class="wallpaper-section">
          <div class="wallpaper-section-title">自定义图片</div>
          <div class="wallpaper-custom-row">
            <button id="btn-wallpaper-upload" class="mini-btn active" type="button">选择本地图片…</button>
            <button id="btn-wallpaper-use-custom" class="mini-btn" type="button" hidden>使用已保存图片</button>
            <button id="btn-wallpaper-clear-custom" class="mini-btn" type="button" hidden>清除本地图片</button>
            <input id="desktop-wallpaper-file" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif,image/svg+xml" hidden />
          </div>
          <form id="desktop-wallpaper-url-form" class="wallpaper-form">
            <input
              id="desktop-wallpaper-url-input"
              class="text-input"
              type="url"
              placeholder="或输入图片地址，例如 https://example.com/wallpaper.jpg"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="mini-btn" type="submit">应用链接</button>
          </form>
        </div>
        <div class="wallpaper-controls">
          <div class="wallpaper-control-row">
            <span class="row-label">填充模式</span>
            <div id="desktop-wallpaper-fit-group" class="row-controls" role="group" aria-label="壁纸填充模式"></div>
          </div>
          <label class="wallpaper-slider-row" for="desktop-wallpaper-dim">
            <span class="row-label">暗化遮罩</span>
            <input id="desktop-wallpaper-dim" type="range" min="0" max="75" step="5" value="0" />
            <span id="desktop-wallpaper-dim-val" class="row-unit">0%</span>
          </label>
          <label class="wallpaper-slider-row" for="desktop-wallpaper-blur">
            <span class="row-label">背景模糊</span>
            <input id="desktop-wallpaper-blur" type="range" min="0" max="24" step="1" value="0" />
            <span id="desktop-wallpaper-blur-val" class="row-unit">0px</span>
          </label>
        </div>
        <footer class="wallpaper-footer">
          <span class="row-hint">本地图片保存在浏览器 IndexedDB，刷新页面后自动保留</span>
          <button id="btn-wallpaper-reset" class="mini-btn" type="button">恢复默认</button>
        </footer>
      </div>
    </div>

    <section class="guest-preview" id="guest-preview" aria-label="Guest 端口预览" hidden>
      <form class="guest-preview-toolbar">
        <label for="guest-preview-port">端口</label>
        <input class="text-input" id="guest-preview-port" type="number" min="1" max="65535" step="1" inputmode="numeric" required />
        <input class="text-input" id="guest-preview-path" aria-label="路径" type="text" value="/" spellcheck="false" />
        <button class="mini-btn active" id="btn-load-preview" type="submit">打开</button>
        <button class="mini-btn" id="btn-close-preview" type="button">关闭</button>
      </form>
      <div class="guest-preview-status" id="guest-preview-status" role="status">运行 guest Web 服务后，输入其端口。</div>
      <div class="guest-preview-frame-area" id="guest-preview-frame-area"></div>
    </section>

    <!-- Minimal Boot Overlay (fades out automatically once Neovim renders) -->
    <div id="boot-overlay" class="boot-overlay">
      <div class="boot-card">
        <div class="boot-header">
          <span class="boot-dot"></span>
          <span class="boot-brand">unkernel · Neovim 0.12</span>
          <span class="boot-badge" id="boot-mode-badge">aarch64 · JIT</span>
        </div>
        <div class="boot-title" id="boot-title">正在初始化运行环境…</div>
        <div class="boot-detail" id="boot-detail">Debian · DefectingCat/nvim</div>
        <div class="boot-bar-track">
          <div class="boot-bar-fill" id="boot-bar-fill"></div>
        </div>
        <div class="boot-actions" id="boot-actions" hidden>
          <button class="mini-btn active" id="btn-boot-snapshot" type="button" hidden>以内存快照模式启动</button>
          <button class="mini-btn active" id="btn-resume-session" type="button">恢复会话</button>
          <button class="mini-btn" id="btn-discard-session" type="button" hidden>放弃快照并启动</button>
        </div>
      </div>
    </div>

    <!-- Floating control center trigger & session tabs -->
    <div class="floating-hud" id="floating-hud">
      <div class="session-tabs" id="session-tabs" role="tablist" aria-label="终端会话"></div>
      <button
        id="btn-enter-desktop"
        class="menu-pill desktop-pill"
        type="button"
        title="切换桌面环境 (Ctrl+Shift+D / ⌘+Shift+D)"
        aria-pressed="false"
      >
        <span>桌面</span>
      </button>
      <button
        id="menu-pill"
        class="menu-pill"
        type="button"
        title="打开控制中心 (Ctrl+Shift+P / ⌘+Shift+P)"
        aria-haspopup="dialog"
        aria-controls="modal-backdrop"
      >
        <span class="pill-dot" id="pill-dot"></span>
        <span class="pill-label" id="pill-label">nvim</span>
        <kbd class="pill-kbd" id="pill-kbd">⌘⇧P</kbd>
      </button>
    </div>

    <!-- Modal Control Center (hidden by default) -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-dialog" id="modal-dialog">
        <header class="modal-header">
          <div class="modal-title-group">
            <h2 class="modal-title" id="modal-title">Neovim 控制中心</h2>
            <span class="modal-subtitle"></span>
          </div>
          <button class="modal-close" id="btn-close-modal" type="button">关闭 <kbd>Esc</kbd></button>
        </header>
        <div class="modal-tabs" role="tablist" aria-label="控制中心">
          <button class="modal-tab" id="modal-tab-workspace" type="button" role="tab" data-tab="workspace" aria-controls="modal-panel-workspace" aria-selected="true">工作区与会话</button>
          <button class="modal-tab" id="modal-tab-storage" type="button" role="tab" data-tab="storage" aria-controls="modal-panel-storage" aria-selected="false" tabindex="-1">存储与备份</button>
          <button class="modal-tab" id="modal-tab-system" type="button" role="tab" data-tab="system" aria-controls="modal-panel-system" aria-selected="false" tabindex="-1">虚拟机与诊断</button>
        </div>
        <div class="modal-panel" id="modal-panel-workspace" role="tabpanel" aria-labelledby="modal-tab-workspace" tabindex="0"></div>
        <div class="modal-panel" id="modal-panel-storage" role="tabpanel" aria-labelledby="modal-tab-storage" tabindex="0" hidden></div>
        <div class="modal-panel" id="modal-panel-system" role="tabpanel" aria-labelledby="modal-tab-system" tabindex="0" hidden></div>
        <div class="modal-feedback" id="modal-feedback" role="status"></div>
        <div class="modal-restart" id="modal-restart" hidden>
          <div id="modal-restart-message" role="status"></div>
          <button class="mini-btn active" id="btn-apply-restart" type="button">同步并重启</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
